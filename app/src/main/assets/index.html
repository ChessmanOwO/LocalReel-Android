const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const messages={tls_verification_failed:'Không xác minh được kết nối bảo mật tới nguồn. Hãy kiểm tra ngày giờ và mạng rồi thử lại.',network:'Kết nối tới nguồn bị lỗi. Thử lại hoặc đổi mạng.',unsupported_url:'Liên kết này chưa được hỗ trợ. Hãy dùng URL của một bài video cụ thể.',unsafe_url:'Địa chỉ bị chặn vì không an toàn hoặc trỏ vào mạng nội bộ.',login_required:'Nguồn yêu cầu đăng nhập hoặc cookie. App chỉ tải nội dung truy cập công khai.',unavailable:'Video không còn khả dụng hoặc bị giới hạn quyền xem.',blocked:'Nguồn chặn truy cập hoặc giới hạn yêu cầu. Thử lại sau.',extraction_failed:'Chưa đọc được nguồn video. Website có thể thay đổi hoặc giới hạn truy cập.',no_audio:'Không có luồng âm thanh truy cập được. Chưa tạo file hoàn tất.',drm:'Nội dung có DRM. App không vượt cơ chế bảo vệ.',live:'Chưa hỗ trợ video đang phát trực tiếp.',playlist:'Bài chứa nhiều mục. Chia sẻ liên kết một video cụ thể.',quality_unavailable:'Chất lượng đã chọn không còn khả dụng. Hãy thử lại.',limit:'Đã chạm giới hạn đang bật hoặc bộ nhớ không đủ. Kiểm tra Cài đặt và dung lượng trống.',timeout:'Nguồn hoặc bộ xử lý chưa phản hồi kịp. Hãy thử lại.',processing_failed:'Không tạo được MP4 có đủ hình và âm thanh.',dependency_missing:'Không khởi động được bộ xử lý video trên thiết bị này.',interrupted:'App hoặc tiến trình đã dừng. Có thể thử lại tác vụ.',internal:'Không hoàn tất xử lý. Hãy thử lại.'};
const names={queued:'Đang chờ',inspecting:'Đang tìm nguồn',awaiting_selection:'Chờ chọn chất lượng',downloading:'Đang tải về máy',processing:'Đang tạo MP4',complete:'Đã tải xong',error:'Chưa tải được',cancelling:'Đang hủy',cancelled:'Đã hủy'};
const terminal=s=>['complete','error','cancelled'].includes(s);
const bytes=n=>n?((n/1024/1024).toFixed(1)+' MB'):'Chưa rõ dung lượng';
const action=(a,id,label,cls='secondary')=>`<button class="${cls}" data-action="${a}" data-id="${esc(id)}">${label}</button>`;
function nav(){phone.querySelector('.nav').innerHTML=[['home','link','Tải video'],['progress','activity','Tiến trình'],['saved','folder','Đã lưu']].map(([v,i,l])=>`<button data-nav="${v}" ${v===view?'class="active" aria-current="page"':''}>${icon(i)}${l}</button>`).join('');}
function home(){return `<div class="intro"><p class="section-kicker">LƯU TRỰC TIẾP TRÊN ĐIỆN THOẠI</p><h2>Video hay,<br>giữ lại để xem.</h2><p>Dán liên kết để tải ngay. App tự tìm nguồn, không cần mở trang gốc.</p></div><section class="download-panel"><div class="panel-heading"><span class="step-number">1</span><h3>Thêm liên kết video</h3></div><label class="field-label" for="url">Liên kết bài viết hoặc video</label><div class="input-box"><textarea id="url" placeholder="https://…" spellcheck="false" aria-describedby="input-help input-error"></textarea><button class="paste" data-action="paste">${icon('paste')}Dán link và tải</button></div><p id="input-error" class="field-error" role="alert" hidden></p><label class="live-check"><input id="ask" type="checkbox" ${askQuality?'checked':''}>Cho tôi chọn chất lượng</label><button class="primary" data-action="submit">${icon('download')}Tìm nguồn và tải</button><p class="helper" id="input-help">${unlimited?'Không đặt trần dung lượng của app. Cần đủ bộ nhớ trống.':'Chế độ an toàn: tối đa 512 MB và 10 phút mỗi tác vụ.'}</p></section><section class="recovery-panel"><span class="recovery-icon">${icon('info')}</span><div><h3>App tự tìm nguồn video</h3><p>Không cần quay lại trang gốc. Nếu kết nối gián đoạn, chọn Thử lại ngay trong LocalReel. Nguồn cần đăng nhập hoặc chặn truy cập sẽ được báo rõ.</p></div></section><section><h3 class="small-heading">Liên kết từ các nguồn</h3><div class="source-list"><span>YouTube</span><span>Facebook</span><span>Instagram</span><span>TikTok</span><span>Douyin</span><span>Xiaohongshu</span></div><p class="footnote" style="margin-top:12px">Hỗ trợ tùy từng video. Không vượt DRM, nội dung riêng tư hoặc giới hạn của nguồn.</p></section>`;}

function card(j){let busy=!terminal(j.state)&&j.state!=='awaiting_selection';let completed=j.state==='complete';let progress=Number(j.progress);let percentage=Number.isFinite(progress)&&j.progress!==null?Math.round(Math.min(Math.max(progress,0),1)*100):null;
 return `<article class="job ${j.state==='error'?'error-job':''}"><div class="job-head"><div class="thumb">${icon('video')}</div><div><p class="badge">${esc(j.platform)}</p><h3>${esc(j.title)}</h3></div></div><div class="job-status"><strong class="${j.state==='error'?'':'green'}">${esc(names[j.state]||j.state)}</strong>${busy&&percentage!==null?`<strong>${percentage}%</strong>`:''}</div>${busy&&percentage!==null?`<div class="progress" role="progressbar" aria-label="Tiến độ tải" aria-valuenow="${percentage}" aria-valuemin="0" aria-valuemax="100"><span style="width:${percentage}%"></span></div>`:''}${j.received&&busy?`<p class="helper">Đã nhận ${bytes(j.received)}</p>`:''}${j.error_code?`<p class="field-error">${esc(messages[j.error_code]||messages.internal)}</p>`:''}${j.note?`<p class="helper">${esc(j.note)}</p>`:''}${completed?`<p class="helper">MP4 · ${j.height?esc(j.height)+" px · ":""}${bytes(j.size)}<br>Chưa xác minh là file gốc người đăng.</p>`:''}<div class="live-actions">${j.state==='awaiting_selection'?action('quality',j.id,'Chọn chất lượng','primary'):''}${busy?action('cancel',j.id,'Hủy tải'):''}${['error','cancelled'].includes(j.state)?action('retry',j.id,'Thử lại'):''}${completed?action('open',j.id,'Xem video','primary')+action('gallery',j.id,'Lưu thư viện')+action('save',j.id,'Lưu vào Tệp')+action('share',j.id,'Chia sẻ'):''}${terminal(j.state)?action('delete',j.id,'Xóa','secondary delete-button'):''}</div></article>`;
}
function progress(){let list=jobs.filter(j=>j.state!=='complete');return `<div class="intro"><p class="section-kicker">TỪ LIÊN KẾT ĐẾN FILE VIDEO</p><h2>Tiến trình</h2><p>${list.length?'Theo dõi video đang xử lý.':'Các video đang tải sẽ hiện tại đây.'}</p></div>${list.length?list.map(card).join(''):`<div class="empty">${icon('download')}<h3>Chưa có tác vụ</h3><p>Dán liên kết để tải video đầu tiên.</p><button class="primary" data-nav="home">Thêm video</button></div>`}<div class="notice">${icon('info')}<span>Giữ app mở để theo dõi. Mất mạng, hết bộ nhớ hoặc Android dừng app có thể làm tác vụ gián đoạn.</span></div>`;}
function saved(){let all=jobs.filter(j=>j.state==='complete'),list=all.filter(j=>j.title.toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));return `<div class="intro"><h2>Video đã lưu</h2><p>${all.length} video trong LocalReel</p></div><label class="search">${icon('search')}<input type="search" value="${esc(query)}" placeholder="Tìm video đã lưu" aria-label="Tìm video đã lưu"></label><div class="library">${list.length?list.map(card).join(''):`<div class="empty">${icon('folder')}<h3>${query?'Không tìm thấy video':'Chưa có video đã lưu'}</h3><p>${query?'Thử tìm bằng từ khóa khác.':'Video tải xong sẽ xuất hiện tại đây.'}</p></div>`}</div><p class="live-notice">File trong app tự dọn sau 7 ngày. Lưu vào Thư viện hoặc Tệp để giữ lâu hơn.</p>`;}
function render(){let active=document.activeElement,focusKey=content.contains(active)&&active?.dataset?.action?{action:active.dataset.action,id:active.dataset.id}:null;let oldScroll=content.scrollTop,search=content.querySelector('input[type=search]'),focused=search===document.activeElement,pos=search?.selectionStart;content.innerHTML=({home,progress,saved})[view]();nav();setSubmitting(submitting);content.scrollTop=oldScroll;if(focused){let field=content.querySelector('input[type=search]');field?.focus({preventScroll:true});try{field?.setSelectionRange(pos,pos)}catch{}}if(focusKey){let match=[...content.querySelectorAll('button')].find(b=>b.dataset.action===focusKey.action&&b.dataset.id===focusKey.id)||[...content.querySelectorAll('button')].find(b=>focusKey.id&&b.dataset.id===focusKey.id);match?.focus({preventScroll:true});}}
function navigate(v){close();view=v;render();content.scrollTop=0;const h=content.querySelector('h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
window.receiveJobs=function(list){jobs=Array.isArray(list)?list:[];if(view!=='home')render();};
window.receiveTheme=value=>{dark=!!value;document.body.classList.toggle('dark',dark);};
window.receiveLimits=value=>{unlimited=!!value;const help=content.querySelector("#input-help");if(help)help.textContent=unlimited?"Không đặt trần dung lượng của app. Cần đủ bộ nhớ trống.":"Chế độ an toàn: tối đa 512 MB và 10 phút mỗi tác vụ.";};
window.inputError=text=>{setSubmitting(false);if(view!=='home')navigate('home');const f=content.querySelector('textarea'),e=content.querySelector('#input-error');e.textContent=text;e.hidden=false;f.setAttribute('aria-invalid','true');f.focus();};
window.submitted=id=>{setSubmitting(false);if(jobs.find(j=>j.id===id&&j.state==='complete')){navigate('saved');notice('Video đã có trong thư viện. Không tải trùng.');}else navigate('progress');};
window.prefill=(text,autoSubmit=false)=>{if(view!=='home')navigate('home');const field=content.querySelector('textarea');field.value=String(text??'');field.removeAttribute('aria-invalid');content.querySelector('#input-error').hidden=true;field.focus();if(autoSubmit)schedulePastedDownload();};
function setSubmitting(value){submitting=!!value;for(const button of content.querySelectorAll('[data-action=submit],[data-action=paste]'))button.disabled=submitting;}
function hasSupportedLink(text){
 if(text.length>16384)return false;
 const hosts=new Set(['facebook.com','www.facebook.com','m.facebook.com','web.facebook.com','fb.watch','instagram.com','www.instagram.com','m.instagram.com','tiktok.com','www.tiktok.com','m.tiktok.com','vm.tiktok.com','vt.tiktok.com','douyin.com','www.douyin.com','v.douyin.com','www.iesdouyin.com','xiaohongshu.com','www.xiaohongshu.com','xhslink.com','www.xhslink.com','youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtu.be','www.youtube-nocookie.com']);
 return (text.match(/https:\/\/[^\s<>"']+/gi)||[]).some(value=>{try{const url=new URL(value);return url.protocol==='https:'&&!url.username&&!url.password&&(!url.port||url.port==='443')&&hosts.has(url.hostname.toLowerCase())&&!value.includes('\\');}catch{return false;}});
}
function submitLink(){
 if(submitting||view!=='home')return;
 const field=content.querySelector('textarea'),text=field.value.trim();
 if(!text){inputError('Hãy dán liên kết video trước.');return;}
 if(!native?.submit){inputError('Bộ tải chưa sẵn sàng. Hãy mở lại app và thử lại.');return;}
 content.querySelector('#input-error').hidden=true;field.removeAttribute('aria-invalid');
 setSubmitting(true);
 try{native.submit(text,content.querySelector('#ask').checked);}catch{inputError('Chưa gửi được tác vụ. Hãy thử lại.');}
}
function schedulePastedDownload(){
 clearTimeout(pasteTimer);
 // Wait until the system paste operation has updated textarea.value.
 pasteTimer=setTimeout(()=>{pasteTimer=null;if(view!=='home'||submitting)return;const text=content.querySelector('textarea')?.value.trim()||'';if(!hasSupportedLink(text)){inputError('Chưa tìm thấy liên kết HTTPS của nền tảng được hỗ trợ.');return;}submitLink();},0);
}
window.notice=text=>{const el=phone.querySelector('.toast');el.textContent=text;el.hidden=false;clearTimeout(el.timer);el.timer=setTimeout(()=>el.hidden=true,6500);};
function close(){phone.querySelector('.overlay').hidden=true;content.inert=false;phone.querySelector('.nav').inert=false;phone.querySelector('.topbar').inert=false;if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});}
function sheet(title,body){if(phone.querySelector('.overlay').hidden)returnFocus=document.activeElement;const el=phone.querySelector('.overlay');el.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="handle"></div><div class="sheet-header"><h2>${esc(title)}</h2><button class="icon-button" data-action="close" aria-label="Đóng">${icon('close')}</button></div>${body}</section>`;el.hidden=false;content.inert=true;phone.querySelector('.nav').inert=true;phone.querySelector('.topbar').inert=true;el.querySelector('button,input')?.focus();}
window.goBack=()=>{if(!phone.querySelector('.overlay').hidden){close();return true;}if(view!=='home'){navigate('home');return true;}return false;};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.focus({preventScroll:true});const a=b.dataset.action,id=b.dataset.id;
 if(b.dataset.nav){navigate(b.dataset.nav);return;}
 if(a==='close'){close();return;}
 if(a==='paste'){if(!submitting)native?.paste();return;}
 if(a==='submit'){submitLink();return;}
 if(a==='settings'){sheet('Cài đặt',`<label class="live-check"><input type="checkbox" id="unlimited" ${unlimited?'checked':''}>Không đặt trần dung lượng/thời gian</label><p class="helper">Áp dụng khi tác vụ bắt đầu xử lý. Vẫn phụ thuộc bộ nhớ trống và giới hạn của Android/nguồn video.</p><button class="secondary settings-row" data-action="theme">${dark?'Chuyển giao diện sáng':'Chuyển giao diện tối'}</button><button class="secondary settings-row" data-action="font">Aa · ${large?'Dùng cỡ chữ thường':'Tăng cỡ chữ'}</button><p class="helper" style="margin-top:18px">Chữ cũng thay đổi theo cỡ chữ hệ thống Android.</p><p class="helper">Tải trực tiếp trên điện thoại. Không cần Mac hoặc dịch vụ tải bên ngoài. Nguồn yêu cầu đăng nhập sẽ được báo rõ.</p><p class="helper">Khi tắt lựa chọn không đặt trần: tối đa 100 tác vụ, 512 MB/tác vụ, 2 GB tổng và 10 phút/tác vụ. Chất lượng theo các định dạng đọc được; một số nguồn có thể giới hạn.</p>`);return;}
 if(a==='theme'){dark=!dark;document.body.classList.toggle('dark',dark);native?.theme(dark);close();return;}
 if(a==='font'){large=!large;document.body.classList.toggle('large-type',large);close();return;}
 if(a==='quality'){const job=jobs.find(j=>j.id===id);if(!job)return;const heights=[...new Set((job.heights||[]).filter(h=>Number.isInteger(h)&&h>0&&h<10000))];sheet('Chọn chất lượng',`<p>Chỉ hiển thị định dạng nguồn cho phép truy cập.</p><label class="quality-option"><input type="radio" name="quality" value="best" checked><span><strong>Cao nhất có thể</strong><small>Ưu tiên độ phân giải cao nhất</small></span></label>${heights.map(h=>`<label class="quality-option"><input type="radio" name="quality" value="${h}"><span><strong>Chiều cao ${h} px</strong><small>Dung lượng tùy video</small></span></label>`).join('')}<button class="primary" data-action="start" data-id="${esc(id)}">${icon('download')}Bắt đầu tải</button>`);return;}
 if(a==='start'){const q=phone.querySelector('input[name=quality]:checked')?.value||'best';close();native?.action(id,'start',q);return;}
 if(a==='cancel'||a==='delete'){sheet(a==='cancel'?'Hủy tải video?':'Xóa video khỏi LocalReel?',`<p>${a==='cancel'?'Video chưa tải xong sẽ không được lưu.':'File trong app sẽ bị xóa. Bản đã lưu riêng vào Thư viện hoặc Tệp vẫn được giữ.'}</p><button class="primary" data-action="close">${a==='cancel'?'Tiếp tục tải':'Giữ video'}</button><button class="secondary settings-row delete-button" data-action="confirm-${a}" data-id="${esc(id)}">${a==='cancel'?'Hủy tải video này':'Xóa video'}</button>`);return;}
 if(a==='confirm-cancel'||a==='confirm-delete'){close();native?.action(id,a==='confirm-cancel'?'cancel':'delete','best');return;}
 if(a==='retry'){native?.action(id,'retry','best');return;}
 if(['open','save','share','gallery'].includes(a))native?.[a](id);
});
document.addEventListener('paste',e=>{if(e.target.id==='url')schedulePastedDownload();});

document.addEventListener('change',e=>{if(e.target.id==='ask'){askQuality=e.target.checked;return;}if(e.target.id==='unlimited'){unlimited=e.target.checked;native?.limits(unlimited);notice(unlimited?'Đã bỏ trần của app cho tác vụ mới.':'Đã bật giới hạn an toàn cho tác vụ mới.');}});
document.addEventListener('input',e=>{if(e.target.type==='search'){query=e.target.value;render();}});
document.addEventListener('keydown',e=>{const modal=phone.querySelector('.overlay:not([hidden])');if(!modal)return;if(e.key==='Escape'){close();return;}if(e.key==='Tab'){const nodes=[...modal.querySelectorAll('button,input')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();native?.ready();
</script></body></html>
